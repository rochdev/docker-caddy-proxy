name: Build, test, and publish

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: ./tests/smoke.sh
      - name: Export tested image
        if: github.ref == 'refs/heads/v2' && github.event_name != 'pull_request'
        run: docker save --output "${RUNNER_TEMP}/image.tar" "$IMAGE_NAME"
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/v2' && github.event_name != 'pull_request'
        with:
          name: image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/v2' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          docker load --input "${RUNNER_TEMP}/image.tar"
          commit_image="${IMAGE_NAME%:v2}:sha-${GITHUB_SHA}"
          docker tag "$IMAGE_NAME" "$commit_image"
          docker push "$commit_image"
          docker push "$IMAGE_NAME"
